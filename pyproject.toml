[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pydebugger-learning-platform"
version = "0.1.0"
description = "Document-grounded programming tutor and debugging engine"
requires-python = ">=3.13,<3.14"
dependencies = [
    "python-dotenv>=1.2.2,<2",
    "langchain-openai>=1.7.4,<2",
    "langchain-google-genai>=4.5,<5",
    "langchain-chroma>=1.1,<2",
    "langgraph>=1.2,<2",
    "pdfplumber>=0.11.10,<0.12",
    "python-pptx>=1.0.2,<2",
    "docutils>=0.23,<0.24",
    "streamlit>=1.67,<2",
    "streamlit-monaco-editor==0.1.6",
    "youtube-transcript-api>=1.2.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.1,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

